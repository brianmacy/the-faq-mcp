name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install ruff mypy "mcp<2"

      - name: Ruff lint
        run: ruff check .claude/faq_server.py

      - name: Ruff format
        run: ruff format --check .claude/faq_server.py

      - name: Mypy type check
        run: mypy --ignore-missing-imports .claude/faq_server.py

      - name: Syntax validation
        run: python -m py_compile .claude/faq_server.py

      - name: Server loads FAQs
        run: |
          python -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('faq_server', '.claude/faq_server.py')
          mod = importlib.util.module_from_spec(spec)
          sys.modules['faq_server'] = mod
          spec.loader.exec_module(mod)
          assert len(mod._faqs) > 0, 'No FAQs loaded'
          assert len(mod._index.by_path) > 0, 'No documents indexed'
          print(f'Loaded {len(mod._index.by_path)} FAQs across {len(mod._faqs)} categories')
          "

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prettier check
        run: npx prettier --check "**/*.md"
